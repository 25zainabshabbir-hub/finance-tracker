apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: BACKEND_IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef: {name: finance-config, key: PORT}
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: {name: finance-config, key: POSTGRES_HOST}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: finance-config, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: db-secret, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-secret, key: POSTGRES_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: app-secret, key: JWT_SECRET}
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: finance
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000