name: aks-build-scan-deploy

# Put this file at .github/workflows/deploy-aks.yaml
# Flow:  sonar scan ─┐
#        build -> trivy -> push (backend, frontend, migrations in parallel) ─┴─> deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # lets the job ask GitHub for an OIDC token (Azure login)
  contents: read

# Never run two deployments at the same time
concurrency:
  group: aks-deploy
  cancel-in-progress: false

env:
  # CHANGE these to match the names you create in the Azure portal
  ACR_NAME: financeacrzainab
  ACR: financeacrzainab.azurecr.io
  RG: finance-rg
  AKS: finance-aks
  VAULT: finance-kv-zainab      # Key Vault names are globally unique
  NS: finance                   # Kubernetes namespace (create it once by hand)

jobs:
  # ---------------------------------------------------------------
  # 1) Code quality / security scan of the source code
  # ---------------------------------------------------------------
  sonar:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Sonar needs full git history

      - name: SonarQube Cloud scan
        # Check the latest version on the action's page, then pin a full commit SHA
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Fail this job if the quality gate fails.
          # While learning, create a repo VARIABLE SONAR_GATE_WAIT = false to turn this off.
          args: >
            -Dsonar.qualitygate.wait=${{ vars.SONAR_GATE_WAIT || 'true' }}

  # ---------------------------------------------------------------
  # 2) Build -> scan -> push, once per image (matrix)
  # ---------------------------------------------------------------
  build-scan-push:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: finance-backend
            context: ./backend
          - name: finance-frontend
            context: ./frontend
          - name: finance-migrations
            context: ./database
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed yet)
        run: docker build --pull -t $ACR/${{ matrix.name }}:${{ github.sha }} ${{ matrix.context }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.35.0   # later: pin the full commit SHA
        with:
          image-ref: ${{ env.ACR }}/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push (only reached if the scan passed)
        run: |
          az acr login --name $ACR_NAME
          docker push $ACR/${{ matrix.name }}:${{ github.sha }}

  # ---------------------------------------------------------------
  # 3) Deploy to AKS (only if Sonar and all three images passed)
  # ---------------------------------------------------------------
  deploy:
    needs: [sonar, build-scan-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials (with kubelogin)
        run: |
          sudo az aks install-cli
          az aks get-credentials -g $RG -n $AKS --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Create Kubernetes secrets from Key Vault
        run: |
          PGUSER=$(az keyvault secret show --vault-name $VAULT --name postgres-user --query value -o tsv)
          echo "::add-mask::$PGUSER"
          PGPASS=$(az keyvault secret show --vault-name $VAULT --name postgres-password --query value -o tsv)
          echo "::add-mask::$PGPASS"
          JWT=$(az keyvault secret show --vault-name $VAULT --name jwt-secret --query value -o tsv)
          echo "::add-mask::$JWT"

          kubectl create secret generic db-secret -n $NS \
            --from-literal=POSTGRES_USER="$PGUSER" \
            --from-literal=POSTGRES_PASSWORD="$PGPASS" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-secret -n $NS \
            --from-literal=JWT_SECRET="$JWT" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Put the new image tags into the manifests
        run: |
          sed -i "s|BACKEND_IMAGE_PLACEHOLDER|$ACR/finance-backend:${{ github.sha }}|" k8s/backend.yaml
          sed -i "s|FRONTEND_IMAGE_PLACEHOLDER|$ACR/finance-frontend:${{ github.sha }}|" k8s/frontend.yaml
          sed -i "s|MIGRATIONS_IMAGE_PLACEHOLDER|$ACR/finance-migrations:${{ github.sha }}|" k8s/migration-job.yaml

      - name: Deploy config and database
        run: |
          kubectl apply -f k8s/configmap.yaml -f k8s/postgres.yaml
          kubectl rollout status statefulset/postgres -n $NS --timeout=300s

      - name: Run database migrations (Job)
        run: |
          kubectl delete job db-migrate -n $NS --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          if ! kubectl wait --for=condition=complete job/db-migrate -n $NS --timeout=240s; then
            echo "Migration job did not finish. Logs:"
            kubectl logs job/db-migrate -n $NS --tail=100 || true
            exit 1
          fi

      - name: Deploy backend, frontend and ingress
        run: kubectl apply -f k8s/backend.yaml -f k8s/frontend.yaml -f k8s/ingress.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/backend -n $NS --timeout=180s
          kubectl rollout status deployment/frontend -n $NS --timeout=180s
          kubectl get pods -n $NS
          kubectl get ingress -n $NS