name: Build, Push to ECR, and Deploy

on:
  push:
    branches: [master]

permissions: #GitHub Actions workflow permissions block
  id-token: write #the workflow is allowed to request a short-lived OpenID Connect (OIDC) token from GitHub's token issuer.
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 954935267955.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::954935267955:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t $ECR_REGISTRY/finance-backend:${{ steps.vars.outputs.tag }} ./backend 
          docker build -t $ECR_REGISTRY/finance-backend:latest ./backend
          docker push $ECR_REGISTRY/finance-backend:${{ steps.vars.outputs.tag }}
          docker push $ECR_REGISTRY/finance-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t $ECR_REGISTRY/finance-frontend:${{ steps.vars.outputs.tag }} ./frontend
          docker build -t $ECR_REGISTRY/finance-frontend:latest ./frontend
          docker push $ECR_REGISTRY/finance-frontend:${{ steps.vars.outputs.tag }}
          docker push $ECR_REGISTRY/finance-frontend:latest

      - name: Build and push database image
        run: |
          docker build -t $ECR_REGISTRY/finance-db:${{ steps.vars.outputs.tag }} ./database
          docker build -t $ECR_REGISTRY/finance-db:latest ./database
          docker push $ECR_REGISTRY/finance-db:${{ steps.vars.outputs.tag }}
          docker push $ECR_REGISTRY/finance-db:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 954935267955.dkr.ecr.eu-north-1.amazonaws.com
            cd ~/finance-tracker
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d
            echo "---- Container Status ----"
            docker ps

            