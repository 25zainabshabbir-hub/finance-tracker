name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: #For the commands in this job, work inside the backend folder.
      run:
        working-directory: backend #
    steps:
      - uses: actions/checkout@v4 #Download/checkout your GitHub repository's code onto the temporary Ubuntu machine.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json #GitHub needs to know which dependency file it should use for the npm cache.

      - run: npm ci
      #- run: npm run lint
      #- run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: #All run commands in this job should run inside frontend.
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      #- run: npm run lint
      #- run: npm test
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    env:
      POSTGRES_USER: ci_user #ci means Continuous Integration. So this is a temporary database setup used only for CI.
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ci_db
      POSTGRES_HOST: localhost
    services: #"Before running my steps, start another service/container that my job needs."
      postgres:
        image: postgres:13 #Use the PostgreSQL Docker image, version 13.
                           #This PostgreSQL container is NOT your application's permanent database.It is a temporary PostgreSQL container used only during the CI job.
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: database/package-lock.json

      - run: npm ci
      - run: npm run build  
      - run: npm run migrate:up

#	"Does the code actually build and work correctly?" (npm build, run migrations against a throwaway test DB) basically for testing